    <path d="M2,42 C2,28 34,28 34,42"/>
  </g>
  <text class="h" x="95" y="252" text-anchor="middle">Caller</text>
  <text class="s" x="95" y="272" text-anchor="middle">Mexican Spanish</text>
  <text class="s" x="95" y="289" text-anchor="middle">or English, by voice</text>

  <!-- Agent -->
  <rect class="card" x="220" y="96" width="230" height="200" rx="12"/>
  <g class="icon conv-s" transform="translate(238,112)">
    <path d="M4,22 V18 A14,14 0 0 1 32,18 V22"/>
    <rect x="1" y="20" width="7" height="12" rx="3"/>
    <rect x="28" y="20" width="7" height="12" rx="3"/>
    <path d="M31,32 C31,38 26,40 20,40"/>
  </g>
  <text class="h" x="284" y="128">Andrea</text>
  <text class="s" x="284" y="146">the phone agent</text>
  <text class="t" x="238" y="182">claude-sonnet-5-5</text>
  <text class="s" x="238" y="202">voice "Ana María"</text>
  <text class="s" x="238" y="220">eleven_v4_turbo</text>
  <text class="s" x="238" y="248">Talks, asks, explains.</text>
  <text class="s" x="238" y="266">Never decides who</text>
  <text class="s" x="238" y="284">gets in.</text>

  <!-- Post-call analysis -->
  <rect class="card" x="220" y="330" width="230" height="130" rx="12"/>
  <g class="icon conv-s" transform="translate(238,346)">
    <rect x="2" y="2" width="26" height="32" rx="4"/>
    <path d="M8,12 H22 M8,19 H22 M8,26 H16"/>
  </g>
  <text class="h" x="278" y="364">Post-call analysis</text>
  <text class="s" x="278" y="382">after hang-up</text>
  <text class="s" x="238" y="412">LLM flags: bypass</text>
  <text class="s" x="238" y="430">attempt, personal data</text>
  <text class="s" x="238" y="448">request. 0 credits.</text>

  <!-- Tool service -->
  <rect class="card" x="580" y="96" width="230" height="250" rx="12"/>
  <g class="icon dec-s" transform="translate(598,112)">
    <path d="M18,2 L33,8 V20 C33,30 26,36 18,39 C10,36 3,30 3,20 V8 Z"/>
    <path d="M11,20 L16,25 L25,15"/>
  </g>
  <text class="h" x="644" y="128">Tool service</text>
  <text class="s" x="644" y="146">enforces every rule</text>
  <text class="mono" x="598" y="184">lookup_user</text>
  <text class="mono" x="598" y="206">verify_identity</text>
  <text class="mono" x="598" y="228">unlock_account</text>
  <text class="s" x="598" y="258">3 tries, then 15 min lockout</text>
  <text class="s" x="598" y="276">5-min single-use token</text>
  <text class="mono" x="598" y="306">/webhooks/elevenlabs</text>
  <text class="s" x="598" y="326">HMAC checked, de-duplicated</text>

  <!-- Directory -->
  <rect class="card" x="580" y="372" width="230" height="88" rx="12"/>
  <g class="icon dec-s" transform="translate(598,388)">
    <ellipse cx="16" cy="7" rx="14" ry="5"/>
    <path d="M2,7 V31 C2,34 9,36 16,36 C23,36 30,34 30,31 V7"/>
    <path d="M2,19 C2,22 9,24 16,24 C23,24 30,22 30,19"/>
  </g>
  <text class="h" x="644" y="404">Directory + TOTP</text>
  <text class="s" x="644" y="422">19 synthetic employees</text>
  <text class="s" x="644" y="440">no stored TOTP secrets</text>

