<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Mande architecture</title>
  <desc id="desc">A caller speaks to the agent on ElevenLabs Agents. The agent calls three tools on a FastAPI service, which decides: it looks up the employee in a mock directory, verifies a TOTP code or sends an Okta Verify push, and unlocks only with a hidden single-use token. The service sends audit events to Splunk, and after the call ElevenLabs sends a post-call webhook that becomes one call event in Splunk. A regression suite of 15 tests runs against the agent.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #8c959f;
      --conv: #7c3aed; --conv-bg: #f5f0ff;
      --dec: #0f766e; --dec-bg: #ecfdf8;
      --ext: #b45309; --ext-bg: #fff8eb;
      --card: #ffffff; --card-line: #d0d7de;
      --lock: #b42318; --mark: #000000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #6e7681;
        --conv: #b197fc; --conv-bg: #1d1530;
        --dec: #4fd1b5; --dec-bg: #0f2220;
        --ext: #f0b45a; --ext-bg: #26190a;
        --card: #161b22; --card-line: #30363d;
        --lock: #ff8a80; --mark: #ffffff;
      }
    }
    .bg { fill: var(--bg); }
    .t { fill: var(--ink); font-size: 15px; }
    .h { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: var(--ink); }
    .zone-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; }
    .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
    .conv-zone { fill: var(--conv-bg); stroke: var(--conv); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dec-zone { fill: var(--dec-bg); stroke: var(--dec); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ext-zone { fill: var(--ext-bg); stroke: var(--ext); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .conv { fill: var(--conv); } .dec { fill: var(--dec); } .ext { fill: var(--ext); }
    .conv-s { stroke: var(--conv); } .dec-s { stroke: var(--dec); } .ext-s { stroke: var(--ext); }
    .icon { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; }
    .arrow-dash { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 5 4; }
    .lab { fill: var(--muted); font-size: 12.5px; }
    .lock { fill: var(--lock); font-size: 12.5px; font-weight: 600; }
    .head { fill: var(--line); }
    .mark { fill: var(--mark); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

